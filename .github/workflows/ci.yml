name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: customization

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: customization/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run check

      - name: Test lyric looping
        run: npm run test:lyric-loop

      - name: Test voice dialog
        run: npm run test:loop-dialog

      - name: Build
        run: npm run build

  android:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Download Spotify App Remote
        shell: pwsh
        run: .\scripts\fetch-spotify-sdk.ps1

      - name: Test and build Android APK
        run: .\gradlew.bat testDebugUnitTest assembleDebug assembleDebugAndroidTest lintDebug

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: lyriclatch-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
